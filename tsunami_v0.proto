syntax = "proto3";

package net.eewbot;

import "models/code_array.proto"
import "models/epicenter.proto"

message TsunamiForecastData {
    uint64 time = 1;
    optional Epicenter epicenter = 2;

    CodeArray forecast = 3;
    CodeArray advisory = 4;
    CodeArray warning = 5;
    CodeArray major_warning = 6;
}
