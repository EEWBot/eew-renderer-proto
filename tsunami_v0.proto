syntax = "proto3";

package tsunami_v0;

message Epicenter {
    int32 lat_x10 = 1;
    int32 lon_x10 = 2;
}

message CodeArray {
    repeated uint32 codes = 1;
}

message TsunamiForecastData {
    uint64 time = 1;
    optional Epicenter epicenter = 2;

    CodeArray forecast = 3;
    CodeArray advisory = 4;
    CodeArray warning = 5;
    CodeArray major_warning = 6;
}
