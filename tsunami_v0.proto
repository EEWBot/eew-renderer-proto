syntax = "proto3";

package net.eewbot;

import "models/code_array.proto";
import "models/epicenter.proto";

message TsunamiForecastData {
    uint64 time = 1;
    optional net.eewbot.models.Epicenter epicenter = 2;

    net.eewbot.models.CodeArray forecast = 3;
    net.eewbot.models.CodeArray advisory = 4;
    net.eewbot.models.CodeArray warning = 5;
    net.eewbot.models.CodeArray major_warning = 6;
}
