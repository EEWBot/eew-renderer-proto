syntax = "proto3";

package net.eewbot;

import "models/code_array.proto"
import "models/epicenter.proto"

message QuakePrefectureData {
    uint64 time = 1;
    optional Epicenter epicenter = 2;

    CodeArray one = 3;
    CodeArray two = 4;
    CodeArray three = 5;
    CodeArray four = 6;
    CodeArray five_minus = 7;
    CodeArray five_plus = 8;
    CodeArray six_minus = 9;
    CodeArray six_plus = 10;
    CodeArray seven = 11;
}
